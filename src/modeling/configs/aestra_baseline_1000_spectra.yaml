# base_config.yaml
# =================
#
# Fichier unique de config pour tout le pipeline d'entraînement.
# Modifie ces valeurs pour tes expériences, puis relance simplement train.py.


# --------------------------------------------------------------------------
# Données
# --------------------------------------------------------------------------
data_dtype: float32       # Type numpy/torch du tableau des spectres (float16/float32/float64)
dataset_cuda: true        # Si true, charge tout le dataset sur le GPU (déconseillé pour gros jeux de données)

checkpoint_every: 100     # Fréquence de sauvegarde des checkpoints (en epochs)
clear_memory_every: 50    # Intervalle de nettoyage mémoire


# --------------------------------------------------------------------------
# DataLoader avancé (contrôle CPU/GPU, workers, transferts)
# --------------------------------------------------------------------------
batch_size: 32            # Nombre d'échantillons par batch
shuffle: true             # True pour mélanger à chaque epoch

num_workers: 0            # Nombre de workers pour le DataLoader (0 = main process)
pin_memory: false         # Active le pinning mémoire (recommandé si GPU)
prefetch_factor: 0        # Nombre de batches préchargés par worker (si num_workers>0)
persistent_workers: false # Garde les workers vivants entre les epochs (si num_workers>0)
move_batches_to_device: false  # Transfert chaque batch sur le device du modèle
non_blocking_transfer: false   # Utilise le transfert non bloquant CPU→GPU


# --------------------------------------------------------------------------
# Augmentation
# --------------------------------------------------------------------------
M_aug: 2                  # Combien de versions augmentées par spectre
vmin: -10                  # Vitesse min (m/s) pour décalage Doppler
vmax: +10                  # Vitesse max (m/s)
interpolate: "linear"     # Méthode d'interpolation
extrapolate: "linear"     # Méthode d'extrapolation hors bornes
out_dtype: float32        # Type de sortie des spectres augmentés (float16 économise ~50% mémoire GPU)
get_aug_data: false        # Si true, calcule les latents des spectres augmentés (loss de consistency)


# --------------------------------------------------------------------------
# Modèle
# --------------------------------------------------------------------------
latent_dim: 3             # Dimension de l'espace latent (anciennement "S")
encode_in_rest_frame: false

b_obs_init: index_758    # Initialise b_obs à partir du spectre index=1613 (faible activité)
b_rest_init: mean         # Moyenne de tous les spectres
b_rest_equal_b_obs: false # Force b_rest = b_obs (si true)

model_dtype: float32      # Type de données pour les poids du modèle (float16/float32/float64)


# --------------------------------------------------------------------------
# Pertes (Losses)
# --------------------------------------------------------------------------
# RV loss
sigma_v: 0.3              # Écart-type pour le bruit Doppler

# Flux reg loss
sigma_y: 0.1              # Écart-type pour le bruit de flux
k_reg_init: 0.0           # Coefficient de régularisation
cycle_length: 1000        # Nombre d’itérations pour un cycle de régularisation

# Consistency loss
consistency_mode: "sigmoid"   # Mode de perte de consistance ("mse" ou "sigmoid")
sigma_s: 0.3              # Poids dans la loss de consistency 

# Fidelity loss
sigma_l: 1.0
mask_weights_fid: false    # Permet d'appliquer un masque lors de la loss de reconstruction sur les spectres (sélectionne que les raies)

# Corrélation loss
sigma_corr: 0.0           # Attention : nécessite get_aug_data == true !!!

# Activité (loss dédiée)
loss_activity: false
alpha_act: 100.0          # Poids de la perte sur l’activité

# b_rest (loss dédiée)
loss_b_rest: false
beta_brest: 1.0           # Poids de la perte sur b_rest

# Lissage de l’activité
smooth_alpha: 0           # 0 = désactivé
smooth_order: 2


# --------------------------------------------------------------------------
# Proxies d’activité
# --------------------------------------------------------------------------
include_activity_proxies: false
activity_proxies_dim: 0   # Dimension des proxies d’activité (0 = désactivé)
proxies_proj_dim: 32      # Dimension de projection des proxies
conditioning_mode: "concat" # Mode de conditionnement ("concat" ou "add")


# --------------------------------------------------------------------------
# Mixed Precision
# --------------------------------------------------------------------------
use_mixed_precision: false          # Activer la mixed precision
mixed_precision_dtype: float16      # Type de données pour les forward passes
autocast_enabled: true              # Utiliser autocast pour le forward pass
grad_scaler_enabled: true           # Activer GradScaler
grad_scaler_init_scale: 65536.0     # Échelle initiale
grad_scaler_growth_factor: 2.0      # Facteur de croissance
grad_scaler_backoff_factor: 0.5     # Facteur de réduction
grad_scaler_growth_interval: 2000   # Intervalle de croissance


# --------------------------------------------------------------------------
# Logging et Plots
# --------------------------------------------------------------------------
save_losses_csv: true      # Sauvegarder les losses dans un CSV
csv_save_every: 100        # Fréquence de sauvegarde CSV (epochs)
plot_every: 50             # Plot des losses
plot_rv_every: 50          # Plot des RV
# (plots spécifiques définis dans la phase "joint")


# --------------------------------------------------------------------------
# Phases d’entraînement
# --------------------------------------------------------------------------
phases:
  - name: rvonly
    n_epochs: 100
    trainable_params:
      b_obs: false
      b_rest: false
      rvestimator: true
      spender: false

    optimizer: "torch.optim.Adam"
    optimizer_kwargs:
      lr: 0.0001
      weight_decay: 0.0

  - name: joint
    n_epochs: 200
    trainable_params:
      b_obs: false
      b_rest: true
      rvestimator: true
      spender: true

    optimizer: "torch.optim.Adam"
    optimizer_kwargs:
      lr: 0.0001
      weight_decay: 0.0

    # scheduler: torch.optim.lr_scheduler.StepLR
    # scheduler_kwargs:
    #   gamma: 0.7
    #   step_size: 50

    plot_activity_every: 20
    plot_latent_distance_every: 20
    plot_latent_space_every: 20