# =================
# base_config.yaml (profil "activity")
# =================

# Données
data_dtype: float32
dataset_cuda: false
checkpoint_every: 100
clear_memory_every: 50

# DataLoader
batch_size: 16
shuffle: true
num_workers: 2
pin_memory: true
prefetch_factor: 2
persistent_workers: true
move_batches_to_device: true
non_blocking_transfer: true

# Augmentation (Doppler)
M_aug: 2
vmin: -8
vmax: +8
interpolate: "linear"
extrapolate: "linear"
out_dtype: float32
get_aug_data: true           # pour la consistance latente et métriques

# Modèle
latent_dim: 3
encode_in_rest_frame: true   # entrée de l'encodeur changée (déshifté par v_encode)
b_obs_init: index_582
b_rest_init: mean            # (sera écrasé en mémoire par b_rest_true côté loader)
b_rest_equal_b_obs: false
model_dtype: float32

# Pertes
# RV loss
sigma_v: 0.3

# Flux reg loss (Lreg du papier)
sigma_y: 0.1
k_reg_init: 0.0
cycle_length: 1000

# Consistency loss (Lc du papier, optionnelle)
consistency_mode: "sigmoid"
sigma_s: 0.3

# Fidelity loss (Lfid)
sigma_l: 1.0
mask_weights_fid: false       # applique un masque raies si dispo côté code

# Corrélation loss (désactivée)
sigma_corr: 0.0

# Activité (loss dédiée vers y_act^true)
loss_activity: false
alpha_act: 5.0

# b_rest
loss_b_rest: false
beta_brest: 0.0

# Loss de lissage d'activité (alpha = 0 si on ne veut pas)
smooth_alpha: 0
smooth_order: 2

# Proxies d’activité (désactivés)
include_activity_proxies: false
activity_proxies_dim: 0
proxies_proj_dim: 32
conditioning_mode: "concat"

# Mixed Precision
use_mixed_precision: true
mixed_precision_dtype: float16
autocast_enabled: true
grad_scaler_enabled: true
grad_scaler_init_scale: 65536.0
grad_scaler_growth_factor: 2.0
grad_scaler_backoff_factor: 0.5
grad_scaler_growth_interval: 2000

# Logging & Plots
save_losses_csv: true
csv_save_every: 100
plot_every: 50
plot_rv_every: 50

# Phases d’entraînement
phases:
  - name: rvonly
    n_epochs: 100
    trainable_params:
      b_obs: false
      b_rest: false        # b_rest fixé = b_rest_true (chargé côté code)
      rvestimator: true
      spender: false
    optimizer: "torch.optim.Adam"
    optimizer_kwargs:
      lr: 1.0e-4
      weight_decay: 0.0


  - name: joint
    n_epochs: 200
    trainable_params:
      b_obs: false
      b_rest: true       
      rvestimator: true
      spender: true
    optimizer: "torch.optim.Adam"
    optimizer_kwargs:
      lr: 1.0e-4
      weight_decay: 0.0

    plot_activity_every: 10
    plot_latent_distance_every: 10
    plot_latent_space_every: 10